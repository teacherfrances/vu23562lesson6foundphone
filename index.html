<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lost Phone L6">
<meta name="theme-color" content="#000000">
<title>The lost phone · Lesson 6</title>
<style>
:root { --fs: 28px; --blue: #0a7aff; --green: #1f9d47; --red: #e5332a; --ink: #1c1c1e; --grey: #6c6c70; --line: #d1d1d6; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.phone { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #000; color: #fff; }
@media (min-width: 640px) and (min-height: 720px) {
  body { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 20%, #2c3e35, #121614 70%); }
  .phone { width: 430px; height: min(920px, calc(100vh - 32px)); border-radius: 56px; border: 12px solid #0b0b0c; box-shadow: 0 0 0 2px #3a3a3c, 0 30px 80px rgba(0,0,0,.6); }
  .island { display: block !important; }
}
.island { display: none; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 112px; height: 30px; background: #000; border-radius: 20px; z-index: 60; }

/* status bar */
.sb { position: absolute; top: 0; left: 0; right: 0; height: 48px; padding: 0 18px 0 26px; display: flex; align-items: center; justify-content: space-between; z-index: 50; font-weight: 600; font-size: 17px; color: #fff; pointer-events: none; }
.phone.light .sb { color: #000; }
.sb .r { display: flex; align-items: center; gap: 6px; pointer-events: auto; }
.sb svg { display: block; }
.fsbtn { background: none; border: 0; padding: 6px; margin-left: 2px; border-radius: 8px; display: flex; color: inherit; min-width: 40px; min-height: 40px; align-items: center; justify-content: center; }
.fsbtn:active { background: rgba(127,127,127,.25); }

.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* wallpapers */
.wall { background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0/90px 110px, radial-gradient(ellipse at 70% 60%, rgba(255,255,255,.14) 0 1.5px, transparent 2.5px) 0 0/70px 80px, linear-gradient(165deg, #0e3b2c 0%, #145a3f 45%, #7a1c22 100%); }

/* intro */
.intro { padding: 70px 22px 24px; overflow: auto; align-items: center; }
.card { background: rgba(255,255,255,.96); color: var(--ink); border-radius: 26px; padding: 22px 20px; width: 100%; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.intro .big { font-size: 64px; text-align: center; line-height: 1.1; }
.intro h1 { font-size: calc(var(--fs) * 1.25); margin: 8px 0 2px; text-align: center; }
.intro .sub { text-align: center; color: var(--grey); font-size: max(17px, calc(var(--fs) * .62)); margin-bottom: 14px; }
.intro p { font-size: var(--fs); line-height: 1.35; margin: 0 0 12px; }
.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: .5em .7em; font-size: var(--fs); font-weight: 700; background: var(--blue); color: #fff; margin-top: 10px; min-height: 62px; }
.btn.alt { background: #e5e5ea; color: var(--ink); }
.btn.green { background: var(--green); }
.btn.warn { background: #fff0d6; color: #7a4a00; }
.wb { background: #eaf6ee; border: 2px solid #9fd8b0; border-radius: 18px; padding: 14px; margin-bottom: 14px; }
.wb b { font-size: var(--fs); }
.wb p { margin: 6px 0 0; }
.warnbox { background: #fff4e0; border: 2px solid #f0c27a; border-radius: 14px; padding: 10px 12px; font-size: max(18px, calc(var(--fs) * .7)); color: #6b4300; margin-bottom: 12px; }

/* lock */
.lock { align-items: center; padding-top: 70px; overflow: auto; }
.lock .date { font-size: 21px; font-weight: 600; opacity: .9; margin-top: 6px; }
.lock .clock { font-size: 88px; font-weight: 300; letter-spacing: -2px; line-height: 1; margin: 2px 0 18px; }
.notes { width: 100%; padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
.noti { background: rgba(240,240,245,.82); color: #000; border-radius: 20px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.noti .ni { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
.noti .nt { flex: 1; min-width: 0; }
.noti .nh { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; }
.noti .nh span { font-weight: 400; color: #555; font-size: 15px; }
.noti .nb { font-size: max(18px, calc(var(--fs) * .7)); line-height: 1.3; }
.unlock { margin: 22px auto 30px; background: rgba(255,255,255,.22); border: 0; color: #fff; border-radius: 30px; padding: 14px 28px; font-size: 21px; font-weight: 600; min-height: 56px; backdrop-filter: blur(10px); }
.pass { align-items: center; padding-top: 80px; background: rgba(0,0,0,.35); }
.pass h2 { font-weight: 500; font-size: 23px; margin: 0 0 18px; }
.dots { display: flex; gap: 20px; margin-bottom: 26px; }
.dots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #fff; display: block; }
.dots i.on { background: #fff; }
.dots.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
.keys { display: grid; grid-template-columns: repeat(3, 84px); gap: 16px 26px; }
.key { width: 84px; height: 84px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 36px; font-weight: 400; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.key small { font-size: 11px; letter-spacing: 2px; font-weight: 700; margin-top: 2px; }
.key.txt { background: none; font-size: 19px; font-weight: 600; }
.key:active { background: rgba(255,255,255,.5); }
.sticky { margin-top: 18px; background: #ffe680; color: #3a3000; padding: 12px 16px; border-radius: 4px; transform: rotate(-2deg); font-size: max(19px, calc(var(--fs) * .72)); max-width: 300px; box-shadow: 0 6px 16px rgba(0,0,0,.3); font-weight: 600; text-align: center; }
.passback { margin-top: 14px; background: none; border: 0; color: #fff; font-size: 18px; text-decoration: underline; min-height: 44px; }

/* home */
.home { padding: 52px 0 0; }
.hscroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
.widget { background: rgba(255,255,255,.88); color: #000; border-radius: 24px; padding: 14px 16px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.widget .wt { font-weight: 800; font-size: max(18px, calc(var(--fs) * .7)); }
.widget .ws { color: #3a3a3c; font-size: max(17px, calc(var(--fs) * .6)); margin: 2px 0 8px; }
.bar { height: 12px; background: #e0e0e5; border-radius: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, #1f9d47, #e5332a); border-radius: 6px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-top: 18px; }
.app { background: none; border: 0; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; padding: 0; min-height: 44px; }
.ico { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 3px 8px rgba(0,0,0,.25); position: relative; }
.app .lab { font-size: 14px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.7); line-height: 1.15; text-align: center; }
.app.locked .ico { filter: grayscale(1) brightness(.6); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; border: 2px solid rgba(0,0,0,.2); }
.badge.done { background: var(--green); }
.badge.lk { background: #3a3a3c; font-size: 12px; }
.app.next .ico { animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(255,255,255,.35); } }
.dock { flex: none; margin: 6px 12px 14px; height: 92px; border-radius: 30px; background: rgba(255,255,255,.25); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; justify-content: space-around; align-items: center; }

/* app */
.phone.light { background: #f2f2f7; }
.appv { background: #f2f2f7; color: var(--ink); padding-top: 48px; }
.ahead { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 8px; background: #f8f8fa; border-bottom: 1px solid var(--line); gap: 6px; }
.ahead .back { background: none; border: 0; color: var(--blue); font-size: 19px; padding: 8px; min-height: 48px; min-width: 76px; text-align: left; }
.ahead .t { font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.ahead .t .mi { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
.ahead .aa { background: #e5e5ea; border: 0; border-radius: 12px; font-weight: 700; font-size: 19px; min-width: 56px; min-height: 48px; }
.split { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ptop { flex: 1 1 50%; overflow-y: auto; overflow-x: hidden; background: #fff; padding: 14px; min-height: 0; position: relative; -webkit-overflow-scrolling: touch; }
.grip { height: 10px; background: #e5e5ea; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; flex: none; }
.grip::after { content: ""; position: absolute; left: 50%; top: 3px; width: 44px; height: 4px; margin-left: -22px; background: #b0b0b6; border-radius: 2px; }
.pq { flex: 1 1 50%; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 22px; min-height: 0; -webkit-overflow-scrolling: touch; }
.qh { display: flex; justify-content: space-between; align-items: center; color: var(--grey); font-size: max(16px, calc(var(--fs) * .6)); font-weight: 600; margin-bottom: 6px; gap: 8px; }
.qd { display: flex; gap: 4px; flex-wrap: wrap; }
.qd i { width: 10px; height: 10px; border-radius: 50%; background: #c7c7cc; display: block; }
.qd i.ok { background: var(--green); }
.qd i.cur { background: var(--blue); }
.prompt { font-size: var(--fs); font-weight: 600; line-height: 1.3; margin: 2px 0 10px; }
.opt { display: flex; align-items: center; gap: .45em; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: .4em .55em; margin: 0 0 .4em; font-size: var(--fs); line-height: 1.25; color: var(--ink); min-height: 64px; }
.opt .lt { flex: none; width: 1.35em; height: 1.35em; border-radius: 50%; background: #e5e5ea; color: #3a3a3c; font-size: .75em; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.opt.right { background: #dcf5e3; border-color: #34c759; }
.opt.right .lt { background: #34c759; color: #fff; }
.opt.wrong { background: #fde4e3; border-color: #ff3b30; opacity: .75; }
.opt.wrong .lt { background: #ff3b30; color: #fff; }
.opt:disabled { cursor: default; }
.row3 { display: flex; gap: 8px; flex-wrap: wrap; }
.row3 .opt { flex: 1 1 0; justify-content: center; text-align: center; min-width: 6.2em; }
.syl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.syl .opt { width: auto; min-width: 2.6em; justify-content: center; font-weight: 700; font-size: calc(var(--fs) * 1.15); }
.line { min-height: 70px; border: 2px dashed #a8a8ae; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; background: #fff; }
.line .ph { color: #8e8e93; font-size: max(17px, calc(var(--fs) * .65)); padding: 6px; }
.chip { background: #fff; border: 2px solid #0a7aff; color: #0058c4; border-radius: 14px; padding: .35em .55em; font-size: var(--fs); text-align: left; min-height: 58px; }
.line .chip { background: #e8f1ff; }
.chip.used { visibility: hidden; }
.bank { display: flex; flex-direction: column; gap: 8px; }
.two { display: flex; gap: 8px; margin-top: 10px; }
.two .btn { margin-top: 0; }
.tapnote { font-size: max(18px, calc(var(--fs) * .75)); color: #0058c4; background: #e8f1ff; border-radius: 14px; padding: 10px 12px; }
.fb { border-radius: 16px; padding: 10px 12px; margin-top: 10px; font-size: max(18px, calc(var(--fs) * .78)); line-height: 1.3; }
.fb.ok { background: #dcf5e3; color: #0f5a26; }
.fb.no { background: #fde4e3; color: #8a1712; }
.fb b { display: block; }

.opt > span:last-child { min-width: 0; overflow-wrap: break-word; word-break: break-word; }
.two .btn { flex: 1 1 0; min-width: 0; }
.chip, .line { max-width: 100%; min-width: 0; overflow-wrap: break-word; word-break: break-word; }
.ttw { overflow-x: auto; }

.post { border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.phead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.ptext { font-size: calc(var(--fs) * .85); line-height: 1.35; }
.plikes { color: var(--grey); font-size: 16px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.call { display: flex; flex-direction: column; gap: 10px; }
.callv { position: relative; height: 150px; border-radius: 18px; background: linear-gradient(160deg, #2c3e50, #1a252f); display: flex; align-items: center; justify-content: center; }
.callbig { font-size: 76px; }
.callsmall { position: absolute; right: 10px; bottom: 10px; width: 60px; height: 76px; border-radius: 12px; background: #4a5a6a; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 2px solid #fff; }
.calllive { position: absolute; left: 10px; top: 10px; color: #fff; background: #e5332a; border-radius: 8px; font-size: 14px; font-weight: 700; padding: 3px 8px; }
.captions { background: #111; color: #fff; border-radius: 14px; padding: 10px 12px; font-size: calc(var(--fs) * .85); line-height: 1.35; }
.captions b { color: #9a9aa0; font-size: 15px; }
.cwho { color: #ffd60a; font-weight: 700; }
.captions .gap { color: #ffd60a; }
.sos { text-align: center; }
.sose { font-size: 64px; }
.sosnums { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.sosnums span { background: #fde4e3; color: #8a1712; border-radius: 10px; padding: 4px 10px; font-weight: 700; font-size: 17px; }
.dircard { border: 2px solid var(--line); border-radius: 18px; padding: 14px; text-align: center; }
.dircard .oe { font-size: 64px; }
.calv { display: flex; flex-direction: column; gap: 8px; }
.cev { border-left: 6px solid #ff3b30; background: #fff5f4; border-radius: 10px; padding: 8px 10px; font-size: calc(var(--fs) * .72); line-height: 1.3; }
.cev b { display: block; color: #b3170e; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.ccard { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: calc(var(--fs) * .72); line-height: 1.35; background: #fafafa; }
.hrs { border-collapse: collapse; width: 100%; font-size: clamp(15px, calc(var(--fs) * .55), 20px); margin-top: 10px; }
.hrs th, .hrs td { border: 1px solid var(--line); padding: 6px 5px; text-align: center; }
.hrs th { background: #fff0d6; }
.hrs td:first-child { text-align: left; font-weight: 700; }
.wordcard .ww, .ccard, .ptext, .captions, .caption { overflow-wrap: break-word; word-break: break-word; }

/* new game types */
.fillrow { display: flex; flex-wrap: wrap; gap: 8px; }
.fillrow .opt { width: auto; flex: 1 1 auto; justify-content: center; background: #fff8e6; border-color: #e7c66b; }
.qgap { display: inline-block; min-width: 3.5em; border-bottom: 3px solid #b07a00; color: #b07a00; text-align: center; }
.qgap.filled { color: #0f5a26; border-color: #1f9d47; background: #dcf5e3; border-radius: 6px; padding: 0 .2em; }
.opt.stk { border-radius: 26px; background: #fff3d6; border: 3px solid #ffb84d; box-shadow: 0 3px 0 #e69a2e; font-weight: 700; }
.opt.stk .lt { background: #ffb84d; color: #fff; }
.swbtns { display: flex; gap: 10px; flex-wrap: wrap; }
.swbtns .opt { flex: 1 1 5.5em; min-width: 0; overflow-wrap: break-word; justify-content: center; text-align: center; font-weight: 800; min-height: 84px; }
.swbtns .opt.l { background: #fff0ef; border-color: #ff8a80; }
.swbtns .opt.r { background: #eefaf1; border-color: #6fd18a; }
.swl { animation: swl .6s forwards; } .swr { animation: swr .6s forwards; }
@keyframes swl { to { transform: translateX(-30px) rotate(-6deg); opacity: .55; } }
@keyframes swr { to { transform: translateX(30px) rotate(6deg); opacity: .55; } }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pcol { display: flex; flex-direction: column; gap: 8px; }
.pbtn { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: .35em .45em; font-size: calc(var(--fs) * .78); text-align: left; min-height: 60px; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }
.pcol.lft .pbtn { background: #eef4ff; border-color: #9cc0ff; font-weight: 700; }
.pbtn.sel { outline: 4px solid #0a7aff; outline-offset: 1px; }
.pbtn.right { background: #dcf5e3 !important; border-color: #34c759 !important; color: #0f5a26; }
.pbtn.wrong { background: #fde4e3 !important; border-color: #ff3b30 !important; }
.sortcard { text-align: center; background: #fff; border: 3px dashed #a8a8ae; border-radius: 18px; padding: 14px; font-size: var(--fs); font-weight: 700; margin-bottom: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
.sortcard.wrong { border-color: #ff3b30; background: #fde4e3; }
.bucks { display: flex; gap: 8px; flex-wrap: wrap; }
.bucks .opt { flex: 1 1 0; min-width: 6em; justify-content: center; text-align: center; font-weight: 700; }
.bins { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.bin { flex: 1 1 0; min-width: 6em; background: #f2f2f7; border-radius: 12px; padding: 6px; min-height: 44px; }
.bin b { display: block; font-size: max(15px, calc(var(--fs) * .55)); color: var(--grey); }
.bin span { display: block; background: #dcf5e3; border-radius: 8px; padding: 2px 6px; margin-top: 4px; font-size: max(16px, calc(var(--fs) * .6)); }
.words { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.words .opt { width: auto; justify-content: center; }
.words .opt.found { background: #fff3cd; border-color: #e0a800; text-decoration: line-through; }
.words .opt.fixed { background: #dcf5e3; border-color: #34c759; text-decoration: none; }
.fixq { font-weight: 700; font-size: max(18px, calc(var(--fs) * .78)); margin: 8px 0 6px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
.slot { width: 1.5em; height: 1.8em; border-bottom: 4px solid #8e8e93; font-size: var(--fs); font-weight: 800; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 6px 6px 0 0; }
.slots.ok .slot { border-color: #1f9d47; color: #0f5a26; background: #dcf5e3; }
.slots.no .slot { border-color: #e5332a; background: #fde4e3; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { width: 1.9em; height: 1.9em; border-radius: 12px; border: 0; background: #ffd60a; box-shadow: 0 4px 0 #c9a400; font-size: var(--fs); font-weight: 800; color: #3a3000; }
.tile.used { visibility: hidden; }
.dial { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.dialv { min-width: 4.2em; text-align: center; font-size: calc(var(--fs) * 1.5); font-weight: 800; background: #111; color: #7CFC9A; border-radius: 14px; padding: .1em .3em; font-variant-numeric: tabular-nums; }
.dbtn { min-width: 64px; min-height: 64px; border-radius: 50%; border: 0; background: #e5e5ea; font-size: max(20px, calc(var(--fs) * .8)); font-weight: 800; color: var(--ink); }
.dunit { text-align: center; color: var(--grey); font-size: max(16px, calc(var(--fs) * .6)); }
.rsteps { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.rsteps span { background: #f2f2f7; border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: max(18px, calc(var(--fs) * .7)); }
.rsteps span.ok { background: #dcf5e3; color: #0f5a26; }
svg .pl.done rect { fill: #b9efc9 !important; stroke: #1f9d47 !important; stroke-width: 6 !important; }
.tags { display: flex; gap: 10px; margin: 0 0 14px; }

    <p>Your progress is saved.</p><button class="btn" data-close>OK</button>`);
});
if (standalone) $('#fsbtn').style.display = 'none';

/* sheet */
function sheet(html, onclick) {
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheetbg'; bg.id = 'sheetbg';
  bg.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) { closeSheet(); return; } if (onclick) onclick(e); });
  phone.appendChild(bg);
}
function closeSheet() { const b = $('#sheetbg'); if (b) b.remove(); }

function banner(app) {
  const el = $('#banner');
  el.innerHTML = `<div class="ni" style="background:linear-gradient(135deg,${app.col[0]},${app.col[1]})">${app.icon}</div><div class="bt"><b>${esc(app.name)} · now</b>${esc(app.banner)}</div>`;
  el.classList.add('show'); clearTimeout(banner.h); banner.h = setTimeout(() => el.classList.remove('show'), 3800);
  el.onclick = () => { el.classList.remove('show'); openApp(APPS.indexOf(app)); };
}

/* two-tap confirm */
function twoTap(btn, label, fn) { if (btn.dataset.armed) { fn(); return; } btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 4000); }
function restart() { const size = S.size; try { localStorage.removeItem(KEYNAME); } catch (e) {} S = fresh(); S.size = size; save(); closeSheet(); setTime(); intro(); }

/* ---------- intro ---------- */
function intro() {
  light(false); setTime();
  const n = doneCount();
  const back = S.started ? `<div class="wb"><b>👋 Welcome back!</b><p>You finished ${n} of ${APPS.length} apps. Your progress is saved.</p>
    <button class="btn green" id="keep">Keep going</button><button class="btn alt" id="again">Start again</button></div>` : '';
  scr.className = 'scr intro wall';
  scr.innerHTML = `<div class="card">${storageOK ? '' : '<div class="warnbox">This browser cannot save your progress. The game still works.</div>'}${back}
    <div class="big">${CFG.big}</div><h1>The lost phone</h1><div class="sub">VU23562 · ${CFG.lessonTag} · ${CFG.lesson}</div>
    ${CFG.intro.map(p => `<p>${p}</p>`).join('')}
    <p>Answer the questions to open the next app. Tap <b>Aa</b> to make the words bigger.</p>
    ${S.started ? '' : '<button class="btn green" id="go">Pick up the phone</button>'}</div>`;
  const go = $('#go'); if (go) go.onclick = () => { if (canFS && coarse) goFS(); S.started = true; save(); lock(); };
  const keep = $('#keep'); if (keep) keep.onclick = () => { if (canFS && coarse) goFS(); S.unlocked ? home() : lock(); };
  const again = $('#again'); if (again) again.onclick = () => twoTap(again, 'Tap again to start again', restart);
}

/* ---------- lock ---------- */
function lock() {
  light(false); setTime();
  scr.className = 'scr lock wall';
  scr.innerHTML = `<div class="date">${CFG.date}</div><div class="clock">${clock()}</div>
    <div class="notes">${CFG.notis.map(n => `<div class="noti"><div class="ni" style="background:${n[1]}">${n[0]}</div><div class="nt"><div class="nh">${n[2]} <span>${n[3]}</span></div><div class="nb">${n[4]}</div></div></div>`).join('')}</div>
    <button class="unlock" id="un">🔓 Tap to unlock</button>`;
  $('#un').onclick = pass;
}
let code = '', bad = 0;
function pass() {
  code = '';
  scr.className = 'scr pass wall';
  const k = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ']];
  const tags = CFG.clues ? `<div class="sticky" style="margin:0 0 12px;transform:none">${CFG.lockTitle}</div><div class="tags">${CFG.clues.map((c, i) => `<button class="tag" data-tag="${i}">${c[0]}<small>No. ${i + 1}</small></button>`).join('')}</div><div id="clue"></div>` : '';
  scr.innerHTML = `<h2>Enter Passcode</h2>${tags}<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys">${k.map(x => `<button class="key" data-d="${x[0]}">${x[0]}<small>${x[1]}</small></button>`).join('')}
    <button class="key txt" id="hint">Hint</button><button class="key" data-d="0">0</button><button class="key txt" id="del">Delete</button></div>
    <div id="sticky"></div><button class="passback" id="pb">Back</button>`;
  scr.querySelectorAll('[data-d]').forEach(b => b.onclick = () => press(b.dataset.d));
  scr.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => showClue(+b.dataset.tag));
  $('#del').onclick = () => { code = code.slice(0, -1); dots(); };
  $('#hint').onclick = showHint;
  $('#pb').onclick = lock;
  if (bad >= 1) showHint();
}
function showClue(i) {
  document.querySelectorAll('[data-tag]').forEach(t => t.classList.toggle('on', +t.dataset.tag === i));
  const c = CFG.clues[i];
  $('#clue').innerHTML = `<div class="clue">${c[0]} Number ${i + 1}: ${c[1]}${bad >= 2 ? `<span class="ans">Answer: ${c[2]}</span>` : ''}</div>`;
}
function showHint() { $('#sticky').innerHTML = `<div class="sticky">${CFG.hint}${bad >= (CFG.clues ? 4 : 3) ? '<br>' + CFG.hint3 : ''}</div>`; }
function dots() { document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i < code.length)); }
function press(d) {
  if (code.length >= 4) return;
  code += d; dots();
  if (code.length === 4) setTimeout(() => {
    if (code === CODE) { S.unlocked = true; save(); home(true); }
    else { bad++; const on = document.querySelector('.tag.on'); if (on) showClue(+on.dataset.tag); const el = $('#dots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); code = ''; setTimeout(dots, 300); showHint(); }
  }, 180);
}

/* ---------- home ---------- */

  light(false); closeSheet(); setTime();
  const n = doneCount();
  scr.className = 'scr home wall';
  scr.innerHTML = `<div class="hscroll"><div class="widget"><div class="wt">${CFG.goal}</div>
    <div class="ws">${CFG.deadline} · now ${clockAP()} · ${n} of ${APPS.length} apps</div>
    <div class="bar"><span style="width:${Math.round(n / APPS.length * 100)}%"></span></div></div>
    <div class="grid">${APPS.map((a, i) => {
      const st = S.apps[a.id] || {}; const locked = i > n; const cls = st.done ? 'done' : locked ? 'locked' : 'next';
      const badge = st.done ? '<span class="badge done">✓</span>' : locked ? '<span class="badge lk">🔒</span>' : '<span class="badge">1</span>';
      return `<button class="app ${cls}" data-i="${i}" aria-label="${esc(a.name)}${locked ? ', locked' : ''}"><div class="ico" style="background:linear-gradient(135deg,${a.col[0]},${a.col[1]})">${a.icon}${badge}</div><div class="lab">${esc(a.name)}</div></button>`;
    }).join('')}</div></div>
    <div class="dock"><button class="app" id="set" aria-label="Settings"><div class="ico" style="background:linear-gradient(135deg,#9a9aa0,#6c6c72)">⚙️</div></button>

    ${n === APPS.length ? `<button class="app" id="run" aria-label="${CFG.runLabel}"><div class="ico" style="background:linear-gradient(135deg,#ff453a,#1f9d47)">${CFG.runIcon}</div></button>` : ''}</div>`;
  scr.querySelectorAll('.grid .app').forEach(b => b.onclick = () => openApp(+b.dataset.i));
  $('#set').onclick = settings; $('#help').onclick = help;

/* ---------- app ---------- */
let cur = null; // { a, idx, st, practice, answered }
function openApp(i) {
  const n = doneCount(); const a = APPS[i];
  if (i > n) { toast(`🔒 Finish ${APPS[n].name} first.`); return; }
  if (S.apps[a.id] && S.apps[a.id].done) {
    const st = S.apps[a.id];
    sheet(`<div class="big">${a.icon}</div><h2>${esc(a.name)}: finished ✓</h2><p>${st.score} of ${a.items.length} right the first time.</p>
      <button class="btn" id="prac">Practise this app again</button><button class="btn alt" data-close>Close</button>`, e => {
      if (e.target.closest('#prac')) { closeSheet(); runApp(i, true); }
    });
    return;
  }
  runApp(i, false);
}
function runApp(i, practice) {
  const a = APPS[i];
  cur = { a, i, practice, st: practice ? { i: 0, w: 0, first: [] } : A(a.id), answered: false };
  if (cur.st.i >= a.items.length) cur.st.i = a.items.length - 1;
  light(true);
  scr.className = 'scr appv';
  scr.innerHTML = `<div class="ahead"><button class="back" id="back">‹ Home</button>
    <div class="t"><span class="mi" style="background:linear-gradient(135deg,${a.col[0]},${a.col[1]})">${a.icon}</span><span>${esc(a.name)}</span></div>
    <button class="aa" id="aa" aria-label="Text size">Aa</button></div>
    <div class="split"><div class="ptop" id="ptop"></div><div class="grip"></div><div class="pq" id="pq"></div></div>`;
  $('#back').onclick = () => home();
  $('#aa').onclick = () => { S.size = (S.size + 1) % SIZES.length; setSize(); save(); toast(`Text size ${S.size + 1} of ${SIZES.length}`); };
  item(true);
}
function mapSvg(nav) {
  const st = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#d6cebd"/>`;
  const lab = (t, x, y, rot) => `<text x="${x}" y="${y}" ${rot ? `transform="rotate(-90 ${x} ${y})"` : ''} text-anchor="middle" dominant-baseline="middle" font-size="16" font-style="italic" font-weight="600" fill="#5b5446">${t}</text>`;
  let s = `<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-label="Practice map of Cammeray">
    <rect width="560" height="520" fill="#efece3"/>`;
  [[0, 0, 170, 150], [210, 0, 150, 150], [404, 0, 156, 150], [0, 190, 170, 150], [210, 190, 150, 150], [404, 190, 156, 150], [0, 380, 170, 140], [210, 380, 150, 140], [404, 380, 156, 140]]
    .forEach(b => s += `<rect x="${b[0] + 4}" y="${b[1] + 4}" width="${b[2] - 8}" height="${b[3] - 8}" rx="10" fill="#f8f6f0" stroke="#ddd5c3"/>`);
  s += st(170, 0, 40, 520) + st(360, 0, 44, 520) + st(0, 150, 560, 40) + st(0, 340, 560, 40);
  s += lab('Palmer St', 190, 75, 1) + lab('Palmer St', 190, 455, 1) + lab('Miller St', 382, 75, 1) + lab('Miller St', 382, 265, 1) + lab('Miller St', 382, 455, 1);
  s += lab('Amherst St', 86, 171) + lab('Amherst St', 285, 171) + lab('Amherst St', 482, 171) + lab('Ernest St', 86, 361) + lab('Ernest St', 285, 361) + lab('Ernest St', 482, 361);
  s += `<text x="40" y="40" font-size="22" font-weight="800" fill="#1E5B45">N ↑</text>`;
  PLACES.forEach(p => {
    const [id, name, em, x, y, w, h] = p; const words = name.split(' ');
    const fill = id === 'park' ? '#cfe6d6' : id === 'hall' ? '#fdf1d6' : '#ffffff', stroke = id === 'park' ? '#1E5B45' : id === 'hall' ? '#D4A12A' : '#4F7F6A';
    const cy = y + h / 2;
    const ey = words.length > 1 ? cy - 20 : cy - 12;
    s += `<g class="pl" data-p="${id}" role="button" aria-label="${name}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
      <text x="${x + w / 2}" y="${ey}" text-anchor="middle" dominant-baseline="middle" font-size="28">${em}</text>
      ${words.map((wd, k) => `<text x="${x + w / 2}" y="${ey + 28 + k * 19}" text-anchor="middle" dominant-baseline="middle" font-size="${wd.length > 6 ? 15 : 17}" font-weight="700" fill="#26302C">${wd}</text>`).join('')}</g>`;
  });
  if (nav) s += `<g aria-label="You are here"><circle cx="352" cy="232" r="17" fill="#e5332a" stroke="#fff" stroke-width="3"/><text x="352" y="233" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#fff">★</text></g>`;
  return s + '</svg>';
}
function item(fresh) {

  if (it.t === 'order') {
    pq.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if (cur.answered) return; cur.placed.push(+b.dataset.c); b.classList.add('used'); drawLine(); });
    $('#clr').onclick = () => { if (cur.answered) return; cur.placed = []; pq.querySelectorAll('[data-c]').forEach(b => b.classList.remove('used')); drawLine(); };
    $('#chk').onclick = checkOrder;
  }
}
function drawLine() {
  const it = cur.a.items[cur.st.i];
  $('#line').innerHTML = cur.placed.length ? cur.placed.map(k => `<div class="chip">${esc(it.chips[k])}</div>`).join('') : '<div class="ph">Tap the parts below.</div>';
}
function fmtDial(it, v) { if (it.kind === 'time') { let h = Math.floor(v / 60) % 12; if (h === 0) h = 12; return h + ':' + String(v % 60).padStart(2, '0') + (v >= 720 ? ' pm' : ' am'); } return it.kind === 'money' ? '$' + v.toFixed(2) : String(v); }
function drawDial() { const it = cur.a.items[cur.st.i]; $('#dv').textContent = fmtDial(it, cur.dv); }
function dialCheck() {
  if (cur.answered) return; const it = cur.a.items[cur.st.i];
  if (Math.abs(cur.dv - it.ans) < 0.001) { right(); return; }
  const low = cur.dv < it.ans;
  wrong(null, it.kind === 'time' ? (low ? 'Too early. Make it later.' : 'Too late. Make it earlier.') : (low ? 'Too low. Try a bigger number.' : 'Too high. Try a smaller number.'));
}
function pairTap(b) {
  if (cur.answered || b.disabled) return;
  if (cur.sel === null) { toast('Tap an expression on the left first.'); return; }
  const it = cur.a.items[cur.st.i]; const l = document.querySelector(`[data-pl="${cur.sel}"]`);
  if (+b.dataset.pr === cur.sel) {
    [l, b].forEach(x => { x.classList.remove('sel'); x.classList.add('right'); x.disabled = true; }); cur.sel = null; cur.got++;
    $('#fb').innerHTML = ''; if (cur.got === it.L.length) right();
  } else {
    [l, b].forEach(x => x.classList.add('wrong')); setTimeout(() => [l, b].forEach(x => x.classList.remove('wrong')), 700);
    wrong(null, 'That is not a pair. Try again.');
  }
}
function sortTap(k) {
  if (cur.answered) return; const it = cur.a.items[cur.st.i]; const c = it.cards[cur.si];
  if (c[1] === k) {
    const sp = document.createElement('span'); sp.textContent = c[0]; $('#bin' + k).appendChild(sp); cur.si++; $('#fb').innerHTML = '';
    if (cur.si === it.cards.length) { $('#scard').textContent = '✓ All sorted!'; right(); } else $('#scard').textContent = it.cards[cur.si][0];
  } else { const sc = $('#scard'); sc.classList.add('wrong'); setTimeout(() => sc.classList.remove('wrong'), 700); wrong(null, 'Not that one. Try again.'); }
}
function spotTap(b) {
  if (cur.answered || cur.spotFound) return; const it = cur.a.items[cur.st.i];
  if (+b.dataset.w === it.bad) {
    b.classList.add('found'); cur.spotFound = b; $('#fb').innerHTML = '';
    $('#fix').innerHTML = `<div class="fixq">✓ Found it! ${esc(it.fixq)}</div>${it.fixOpts.map((o, k) => `<button class="opt" data-f="${k}"><span class="lt">${'abc'[k]}</span><span>${esc(o)}</span></button>`).join('')}`;
    document.querySelectorAll('[data-f]').forEach(f => f.onclick = () => {
      if (cur.answered || f.disabled) return;
      if (+f.dataset.f === it.fixAns) { f.classList.add('right'); cur.spotFound.textContent = it.fixOpts[it.fixAns]; cur.spotFound.classList.add('fixed'); right(); }
      else { f.classList.add('wrong'); f.disabled = true; wrong(null, 'Not that one. Try again.'); }
    });
  } else { b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 700); wrong(null, 'That word is OK. Look again.'); }
}
function drawSlots() { const it = cur.a.items[cur.st.i]; document.querySelectorAll('#slots .slot').forEach((s, i) => s.textContent = cur.sp[i] !== undefined ? it.tiles[cur.sp[i]] : ''); }
function spellTap(b) {
  if (cur.answered || b.classList.contains('used')) return; const it = cur.a.items[cur.st.i];
  cur.sp.push(+b.dataset.t); b.classList.add('used'); drawSlots();
  if (cur.sp.length === it.word.length) {
    const w = cur.sp.map(k => it.tiles[k]).join('');
    if (w === it.word) { $('#slots').classList.add('ok'); right(); }
    else { $('#slots').classList.add('no'); wrong(null, it.hint || 'Try again.'); setTimeout(() => { $('#slots').classList.remove('no'); cur.sp = []; document.querySelectorAll('[data-t]').forEach(x => x.classList.remove('used')); drawSlots(); }, 900); }
  }
}
function choose(b) {
  if (cur.answered || b.disabled) return;
  const it = cur.a.items[cur.st.i];
  const ok = it.t === 'mc' ? +b.dataset.k === it.ans : it.t === 'swipe' ? +b.dataset.v === it.a : (it.t === 'rwd' || it.t === 'cat') ? b.dataset.v === it.a : +b.dataset.k === it.a;
  if (ok) { b.classList.add('right');
    if (it.fill) { const g = $('#qgap'); if (g) { g.textContent = it.opts[it.ans]; g.classList.add('filled'); } }
    if (it.t === 'swipe') { const c = $('#ptop').firstElementChild; if (c && !reduce) c.classList.add(it.a ? 'swr' : 'swl'); }
    right(); }
  else { b.classList.add('wrong'); b.disabled = true; wrong(); }
}
function tapPlace(g) {
  const it = cur.a.items[cur.st.i];
  if (it.t === 'route') {
    if (g.classList.contains('done')) return;
    if (g.dataset.p === it.seq[cur.ri]) { g.classList.add('done'); const sp = document.querySelectorAll('#rs span')[cur.ri]; sp.textContent = (cur.ri + 1) + ' ✓ ' + g.getAttribute('aria-label'); sp.classList.add('ok'); cur.ri++; $('#fb').innerHTML = ''; if (cur.ri === it.seq.length) right(); }
    else { g.classList.add('hitno'); setTimeout(() => g.classList.remove('hitno'), 900); wrong(g.getAttribute('aria-label')); }
    return;
  }
  if (g.dataset.p === it.a) { g.classList.add('hitok'); right(); }
  else { g.classList.add('hitno'); setTimeout(() => g.classList.remove('hitno'), 900); wrong(g.getAttribute('aria-label')); }
}
function checkOrder() {
  if (cur.answered) return;
  const it = cur.a.items[cur.st.i];
  if (cur.placed.length < it.chips.length) { toast('Tap all the parts first.'); return; }
  if (cur.placed.every((k, i) => k === i)) right();
  else { wrong(); cur.placed = []; document.querySelectorAll('#bank [data-c]').forEach(b => b.classList.remove('used')); drawLine(); }
}
function wrong(tapped, msg) {
  const it = cur.a.items[cur.st.i]; cur.st.w++; if (!cur.practice) save();
  $('#fb').innerHTML = `<div class="fb no"><b>✗ ${msg ? esc(msg) : 'Not quite. Try again.'}</b>${tapped ? 'That is the ' + esc(tapped.toLowerCase()) + '. ' : ''}${it.hint ? 'Hint: ' + esc(it.hint) : ''}</div>`;
}
function right() {
  const { a, st } = cur; const it = a.items[st.i];
  cur.answered = true;
  st.first[st.i] = st.w === 0; st.w = 0; st.i++;
  if (!cur.practice) save();
  document.querySelectorAll('#ctl button').forEach(b => b.disabled = true);
  $('#fb').innerHTML = `<div class="fb ok"><b>✓ Right!</b>${esc(it.why)}</div>`;
  const last = st.i >= a.items.length;
  $('#nx').innerHTML = `<button class="btn ${last ? 'green' : ''}" id="next">${last ? 'Finish ' + esc(a.name) : 'Next'}</button>`;
  $('#next').onclick = () => last ? finishApp() : item(false);
  const pq = $('#pq'); setTimeout(() => { pq.scrollTo ? pq.scrollTo({ top: pq.scrollHeight, behavior: reduce ? 'auto' : 'smooth' }) : (pq.scrollTop = pq.scrollHeight); }, 30);
  document.querySelectorAll('.qd i')[st.i - 1].className = 'ok';
}
function finishApp() {
  const { a, st, practice } = cur;
  const score = st.first.filter(Boolean).length;
  if (practice) {
    sheet(`<div class="big">${a.icon}</div><h2>Practice finished</h2><p>${score} of ${a.items.length} right the first time.</p><button class="btn" id="hm">Back to Home</button>`, e => { if (e.target.closest('#hm')) home(); });
    return;
  }
  st.done = true; st.score = score; save(); setTime();
  const n = doneCount(); const all = n === APPS.length;
  sheet(`<div class="big">✅</div><h2>${esc(a.name)} done!</h2>
    <p>⭐ ${score} of ${a.items.length} right the first time.</p>
    <p>🕐 +5 minutes. It's now <b>${clockAP()}</b>.</p>
    ${all ? `<p>${esc(CFG.allDone)}</p><button class="btn green" id="fin">${CFG.runBtn}</button>` : `<p>Next app: ${APPS[n].icon} <b>${esc(APPS[n].name)}</b></p><button class="btn" id="hm">Back to Home</button>`}`, e => {
    if (e.target.closest('#hm')) home();
    if (e.target.closest('#fin')) finale();
  });
}

/* ---------- finale ---------- */
function finale() {
  closeSheet(); light(false); setTime();
  const total = APPS.reduce((n, a) => n + ((S.apps[a.id] || {}).score || 0), 0);
  const pct = total / TOTAL; const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
  scr.className = 'scr final wall';
  scr.innerHTML = `<div class="card"><div class="stars">${'⭐'.repeat(stars)}</div>
    <p><b>It's ${clockAP()}.</b> ${CFG.finale[0]}</p>
    ${CFG.finale.slice(1).map(f => `<p class="say">${f[0]} <b>${f[1]}:</b> ${esc(f[2])}</p>`).join('')}
    <div class="score">${total} of ${TOTAL}</div><p style="text-align:center">right the first time</p>
    <div class="slist">${APPS.map(a => `<span>${a.icon} ${esc(a.name)}</span><b>${(S.apps[a.id] || {}).score || 0}/${a.items.length}</b>`).join('')}</div>
    <p>Merry Christmas! 🎄 Practise any app again from the Home Screen.</p>
    <button class="btn" id="hm">Back to Home</button><button class="btn alt" id="pa">Play again</button></div>`;
  $('#hm').onclick = () => home();
  $('#pa').onclick = () => twoTap($('#pa'), 'Tap again to start again', restart);
  if (!reduce) { const em = ['🎄', '⭐', '🎁', '🎅', '❄️', '🦌']; for (let k = 0; k < 36; k++) { const c = document.createElement('span'); c.className = 'confetti'; c.textContent = em[k % em.length]; c.style.left = Math.random() * 100 + '%'; c.style.animationDuration = 3 + Math.random() * 3 + 's'; c.style.animationDelay = Math.random() * 2 + 's'; phone.appendChild(c); setTimeout(() => c.remove(), 8500); } }
}

setSize(); setTime(); intro();
</script>
</body>
